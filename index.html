<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEGATEH | Фортуна</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --apple-blue: #0071e3;
            --apple-green: #34c759;
            --apple-gray: #f5f5f7;
            --text-dark: #1d1d1f;
            --premium-gold: #ff9500;
            --premium-purple: #af52de;
            --premium-red: #ff3b30;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #ffffff;
            color: var(--text-dark);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .logo { font-weight: 600; font-size: 22px; letter-spacing: 1px; margin-bottom: 5px; }
        h1 { font-size: 32px; font-weight: 600; margin: 0 0 10px 0; letter-spacing: -0.8px; }
        .subtitle { font-size: 16px; color: #86868b; margin-bottom: 30px; }

        .wheel-box {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 40px;
        }

        .wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 15px 50px rgba(0,0,0,0.08);
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
            border: 6px solid #fff;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 28px;
            background: var(--apple-blue);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
        }

        .btn-spin {
            background: var(--apple-blue);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 18px;
            font-weight: 500;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(0, 113, 227, 0.2);
        }

        .btn-spin:active { transform: scale(0.95); }
        .btn-spin:disabled { background: #d2d2d7; box-shadow: none; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 100;
            align-items: center; justify-content: center;
        }

        .modal-content {
            background: #fff;
            padding: 40px 30px;
            border-radius: 30px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.12);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 16px;
            margin: 20px 0;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        .btn-action {
            background: var(--apple-green);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        .sms-info {
            background: #f5f5f7;
            padding: 15px;
            border-radius: 12px;
            font-size: 13px;
            color: #424245;
            margin: 20px 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">MEGATEH</div>
    <h1>Фортуна</h1>
    <p class="subtitle">Ваш шанс на персональный бонус</p>

    <div class="wheel-box">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600" class="wheel-canvas"></canvas>
    </div>

    <button id="spinBtn" class="btn-spin" onclick="spinWheel()">Играть</button>
</div>

<div id="winModal" class="modal">
    <div class="modal-content">
        <h2 style="margin:0">Выигрыш!</h2>
        <div id="winText" style="font-size: 56px; font-weight: 600; color: var(--apple-blue); margin: 15px 0;">5%</div>
        <p style="color: #86868b; font-size: 15px;">Зарегистрируйте номер для активации скидки</p>
        <form id="phoneForm">
            <input type="tel" id="userPhone" placeholder="+993 6..." required>
            <button type="submit" class="btn-action">Продолжить</button>
        </form>
    </div>
</div>

<div id="smsModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0">Последний шаг</h3>
        <div class="sms-info">
            После нажатия кнопки откроется SMS. Отправьте его, чтобы закрепить скидку. Сотрудник активирует её в магазине.
        </div>
        <button onclick="sendSms()" class="btn-action" style="background: var(--apple-blue);">Отправить сообщение</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    let winDiscount = "";

    // Веса: 5% (50), 10% (10), 25% (0), 30% (0), остальные по 8.
    const sectors = [
        { label: '5%', color: '#ffffff', text: '#0071e3', weight: 50 },
        { label: '25%', color: '#af52de', text: '#fff', weight: 0 },
        { label: '4%', color: '#ffffff', text: '#0071e3', weight: 8 },
        { label: '1%', color: '#0071e3', text: '#fff', weight: 8 },
        { label: '30%', color: '#ff3b30', text: '#fff', weight: 0 },
        { label: '10%', color: '#ff9500', text: '#fff', weight: 10 },
        { label: '3%', color: '#ffffff', text: '#0071e3', weight: 8 },
        { label: '2%', color: '#0071e3', text: '#fff', weight: 8 },
        { label: 'ЕЩЁ', color: '#8e8e93', text: '#fff', weight: 8 }
    ];

    const arc = (2 * Math.PI) / sectors.length;

    function draw() {
        sectors.forEach((s, i) => {
            const angle = i * arc;
            ctx.beginPath();
            ctx.fillStyle = s.color;
            ctx.moveTo(300, 300);
            ctx.arc(300, 300, 300, angle, angle + arc);
            ctx.fill();
            
            ctx.save();
            ctx.translate(300, 300);
            ctx.rotate(angle + arc / 2);
            ctx.fillStyle = s.text;
            ctx.font = "bold 42px Inter";
            ctx.textAlign = "right";
            ctx.fillText(s.label, 260, 15);
            ctx.restore();
        });
    }
    draw();

    function spinWheel() {
        spinBtn.disabled = true;
        const totalWeight = sectors.reduce((acc, s) => acc + s.weight, 0);
        const rand = Math.random() * totalWeight;
        let cumulative = 0;
        let winIndex = 0;

        for (let i = 0; i < sectors.length; i++) {
            cumulative += sectors[i].weight;
            if (rand <= cumulative) { winIndex = i; break; }
        }

        const sectorDeg = 360 / sectors.length;
        // Случайное смещение внутри сектора для реализма
        const extraPadding = Math.floor(Math.random() * (sectorDeg - 10)) + 5;
        const rotation = 3600 + (360 - (winIndex * sectorDeg)) - extraPadding - 90;
        
        canvas.style.transform = `rotate(${rotation}deg)`;

        setTimeout(() => {
            const res = sectors[winIndex].label;
            if (res === 'ЕЩЁ') {
                alert('Попробуйте еще раз!');
                spinBtn.disabled = false;
                canvas.style.transition = 'none';
                canvas.style.transform = 'rotate(0deg)';
                setTimeout(() => canvas.style.transition = 'transform 5s cubic-bezier(0.15, 0, 0.15, 1)', 50);
            } else {
                winDiscount = res;
                document.getElementById('winText').innerText = res;
                document.getElementById('winModal').style.display = 'flex';
            }
        }, 5000);
    }

    document.getElementById('phoneForm').onsubmit = function(e) {
        e.preventDefault();
        document.getElementById('winModal').style.display = 'none';
        document.getElementById('smsModal').style.display = 'flex';
    };

    function sendSms() {
        const targetNumber = "+99361828377";
        const text = `MEGATEH: Скидка ${winDiscount} подтверждаю. Закрепите за моим номером.`;
        
        const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const link = `sms:${targetNumber}${isiOS ? '&' : '?'}body=${encodeURIComponent(text)}`;
        
        window.location.href = link;

        setTimeout(() => {
            document.getElementById('smsModal').style.display = 'none';
            spinBtn.disabled = false;
        }, 2000);
    }
</script>

</body>
</html>
